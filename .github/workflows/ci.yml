# CI: run the full test suite (including the real-browser UI tests) on Linux, Windows and macOS,
# and build the Docker image, on every push and pull request.
# SQLite uses unpdf for PDF extraction and does not need the optional Postgres driver.
# The Postgres job installs the one optional dependency (pg) and runs the same full suite against a Postgres service.
# Publishing the image to ghcr.io on a version tag is in release.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Windows runners set core.autocrlf=true; .gitattributes (eol=lf) must still give LF files,
      # otherwise size checks (e.g. the spec length in doc-rules-test) and hashes fail for the wrong reason
      - name: Check line endings (LF)
        run: |
          crlf=$(git ls-files --eol | grep 'w/crlf' || true)
          if [ -n "$crlf" ]; then echo "Checked out with CRLF:"; echo "$crlf"; exit 1; fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # UI tests drive a real headless Chrome (scripts/browser-kit.js looks in the usual install path of each OS;
      # GitHub's Ubuntu, Windows and macOS images all ship Google Chrome). Fail here instead of silently skipping UI tests.
      - name: Show tool versions
        run: |
          node --version
          node --input-type=module -e "const { findBrowser } = await import('./scripts/browser-kit.js'); const b = findBrowser(); console.log('browser:', b); if (!b) process.exit(1);"
          node --input-type=module -e "const { findBrowser } = await import('./scripts/browser-kit.js'); const { execFileSync } = await import('node:child_process'); try { console.log(execFileSync(findBrowser(), ['--version'], { encoding: 'utf8', timeout: 20000 }).trim()); } catch (e) { console.log('browser version: ' + e.message); }"
      - name: Verify SQLite without optional packages
        run: node scripts/kb-no-curate-test.js --without-unpdf
      - run: npm ci --include=optional
      - name: Run tests
        run: npm test
        env:
          CI: 'true'
          TEST_TIMEOUT_SEC: '300'

  # Same full suite on Postgres (DATABASE_URL mode). Tests only ever connect to this local service container.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aigile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the Postgres driver (pg, pinned in package-lock.json)
        run: npm ci
      - name: Run tests on Postgres
        run: npm test
        env:
          CI: 'true'
          TEST_TIMEOUT_SEC: '300'
          AIGILE_TEST_PG_URL: postgres://postgres:test@localhost:5432/aigile_test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t aigile-switch:ci .
      - name: Start and check health
        run: |
          docker run -d --name aigile -p 3000:3000 -e ADMIN_PASSWORD=ci-check-pass aigile-switch:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-check-pass"}' http://localhost:3000/api/auth/password)
          echo "admin login: $code"; test "$code" = 200
      - name: Container logs
        if: always()
        run: docker logs aigile || true
      # docker compose with Postgres included (docker-compose.postgres.yml): one command, data in Postgres
      - name: Start with Postgres (compose) and check health
        run: |
          docker rm -f aigile
          ADMIN_PASSWORD=ci-check-pass docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-check-pass"}' http://localhost:3000/api/auth/password)
          echo "admin login: $code"; test "$code" = 200
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml exec -T postgres psql -U aigile -d aigile -tAc "SELECT COUNT(*) FROM participants" | grep -qx 1
      - name: Compose logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs || true
