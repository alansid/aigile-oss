# Release: when a version tag (v*) is pushed, build the Docker image for linux/amd64 and linux/arm64
# and push it to GitHub Container Registry as ghcr.io/<owner>/<repo>:<version> and :latest.
# The image has no npm dependencies (COPY + mkdir only), so the arm64 build under QEMU stays fast.
name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The app reports its version from package.json: refuse to publish v1.2.3 if package.json says something else
      - name: Check tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          echo "tag: $GITHUB_REF_NAME, package.json: $pkg"
          test "${GITHUB_REF_NAME#v}" = "$pkg"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Same check as CI before anything is pushed: the image starts, is healthy and the admin can log in
      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aigile-switch:smoke
      - name: Start and check health
        run: |
          docker run -d --name aigile -p 3000:3000 -e ADMIN_PASSWORD=ci-check-pass aigile-switch:smoke
          for i in $(seq 1 30); do curl -fs http://localhost:3000/api/health && break; sleep 1; done
          curl -fs http://localhost:3000/api/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-check-pass"}' http://localhost:3000/api/auth/password)
          echo "admin login: $code"; test "$code" = 200
      - name: Container logs
        if: always()
        run: docker logs aigile || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.0.3 -> 1.0.3 and latest (latest is skipped for pre-release tags such as v1.1.0-rc.1)
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Aigile-Switch
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Aigile-Switch
            org.opencontainers.image.licenses=MIT

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
